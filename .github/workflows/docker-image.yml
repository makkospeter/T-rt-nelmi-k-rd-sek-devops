




name: Build docker images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch: 

  

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4



    - name: Docker Login
  
      uses: docker/login-action@v4.8.0
      with:
     
        registry: ghcr.io
     
        username: makkospeter
     
        password: ${{secrets.GITHUB_TOKEN}}
       
  
    
     

    
    - name: Build the Docker image
      run: 
        VERSION=$(date +%s)
        docker build ./backend --tag ghcr.io/makkospeter/Kviz-backend:$VERSION
        docker build ./frontend --tag ghcr.io/makkospeter/Kviz-frontend:$VERSION
        docker push ghcr.io/makkospeter/Kviz-backend:$VERSION
        docker push ghcr.io/makkospeter/Kviz-frontend:$VERSION
